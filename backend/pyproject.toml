[project]
name = "whd"
version = "0.1.0"
description = "Wireless Hardware Debugger: Linux PCIe/USB wireless adapter debugging platform"
requires-python = ">=3.12"
license = { text = "GPL-2.0-only" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
]

[project.scripts]
whd = "whd.__main__:main"
whd-helper = "whd.helper.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*", "__pycache__"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: runs against real host hardware (opt-in via WHD_LIVE=1)"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/whd"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101", "S603", "S607", "RUF012", "S404", "E501", "SIM105", "SIM102", "E731", "S112", "S110", "BLE001", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "SIM117", "B017", "RUF059"]
